---
version: 6.0.0
slug: configurator
name: File editor
description: Simple browser-based file editor for Home Assistant
url: https://github.com/home-assistant/addons/tree/master/configurator
arch:
  - aarch64
  - amd64
homeassistant: 0.91.1
homeassistant_api: true
image: homeassistant/{arch}-addon-configurator
ingress: true
init: false
map:
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  dirsfirst: false
  enforce_basepath: true
  git: true
  ignore_pattern:
    - __pycache__
    - .cloud
    - .storage
    - deps
  ssh_keys: []
panel_icon: mdi:wrench
schema:
  dirsfirst: bool
  enforce_basepath: bool
  git: bool
  ignore_pattern:
    - str
  ssh_keys:
    - str


    sensor:
  - platform: rest
    name: strompreis_raw
    resource: "https://api.transparency.example/prices/today"  # ersetzen
    headers:
      Authorization: "Bearer bb4a0410-5f4b-4874-8bdd-0fbc62707d25"                     # ersetzen
    method: GET
    json_attributes_path: "$.prices"                             # anpassen falls nötig
    json_attributes:
      - prices
    value_template: "{{ now().isoformat() }}"                   # Dummy; Werte in attributes
    scan_interval: 600

